name: Release App

on:
  push:
    tags:
      - "v*" # 当你推送以 v 开头的标签（如 v1.0）时触发

jobs:
  build_and_release:
    runs-on: windows-latest
    permissions:
      contents: write # 必须赋予写入权限才能创建 Release

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Python & 打包
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller -r requirements.txt
        pyinstaller --onefile main.py

    - name: 发布到 GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/GeoJSON_to_Shp.exe  # 要上传的文件路径
        tag_name: ${{ github.ref_name }} # 使用当前的 Tag 名
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 自动调用的身份令牌